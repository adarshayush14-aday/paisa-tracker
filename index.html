<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaisaTrack — Expense Tracker</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PaisaTrack">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223b;
      --border: #2d2d4e;
      --income: #00e5a0;
      --expense: #ff4f7b;
      --accent: #7c6af7;
      --text: #f0f0ff;
      --text-dim: #8888aa;
      --glow-income: rgba(0,229,160,0.15);
      --glow-expense: rgba(255,79,123,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      padding: 24px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--income); }

    .month-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }

    /* Balance Card */
    .balance-card {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, #7c6af7 0%, #5e4dd6 50%, #3d2fa8 100%);
      border-radius: 24px;
      padding: 28px 24px;
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }

    .balance-card::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -20px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    .balance-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.75;
      margin-bottom: 8px;
    }

    .balance-amount {
      font-family: 'Syne', sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 24px;
    }

    .balance-row {
      display: flex;
      gap: 16px;
    }

    .balance-mini {
      background: rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px 16px;
      flex: 1;
      backdrop-filter: blur(10px);
    }

    .balance-mini-label {
      font-size: 11px;
      opacity: 0.75;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .balance-mini-amount {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
    }

    /* Add Transaction */
    .add-section {
      margin: 0 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .type-toggle {
      display: flex;
      background: var(--surface2);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 14px;
    }

    .type-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      color: var(--text-dim);
      transition: all 0.2s;
    }

    .type-btn.active-income {
      background: var(--income);
      color: #0f0f1a;
    }

    .type-btn.active-expense {
      background: var(--expense);
      color: #fff;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text-dim); }
    select { cursor: pointer; }
    select option { background: var(--surface2); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .add-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      margin-top: 4px;
      transition: all 0.2s;
    }

    .add-btn.income { background: var(--income); color: #0f0f1a; }
    .add-btn.expense { background: var(--expense); color: #fff; }
    .add-btn:hover { transform: translateY(-2px); opacity: 0.9; }

    /* Transactions */
    .tx-section {
      margin: 0 16px 100px;
    }

    .tx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .tx-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }

    .clear-btn:hover { border-color: var(--expense); color: var(--expense); }

    .tx-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    .tx-empty-icon { font-size: 40px; margin-bottom: 10px; }

    .tx-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tx-icon {
      width: 46px; height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .tx-icon.income { background: var(--glow-income); }
    .tx-icon.expense { background: var(--glow-expense); }

    .tx-info { flex: 1; }

    .tx-desc {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .tx-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 8px;
    }

    .tx-cat {
      background: var(--surface2);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .tx-amount {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-align: right;
    }

    .tx-amount.income { color: var(--income); }
    .tx-amount.expense { color: var(--expense); }

    .tx-delete {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .tx-delete:hover { color: var(--expense); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">Paisa<span>Track</span></div>
  <div class="month-badge" id="monthBadge"></div>
</div>

<!-- Balance Card -->
<div class="balance-card">
  <div class="balance-label">Total Balance</div>
  <div class="balance-amount" id="totalBalance">₹0</div>
  <div class="balance-row">
    <div class="balance-mini">
      <div class="balance-mini-label">↑ Income</div>
      <div class="balance-mini-amount" id="totalIncome">₹0</div>
    </div>
    <div class="balance-mini">
      <div class="balance-mini-label">↓ Expense</div>
      <div class="balance-mini-amount" id="totalExpense">₹0</div>
    </div>
  </div>
</div>

<!-- Add Transaction -->
<div class="add-section">
  <div class="section-title">Add Transaction</div>

  <div class="type-toggle">
    <button class="type-btn active-income" id="incomeBtn" onclick="setType('income')">↑ Income</button>
    <button class="type-btn" id="expenseBtn" onclick="setType('expense')">↓ Expense</button>
  </div>

  <div class="two-col">
    <div class="input-group">
      <div class="input-label">Amount (₹)</div>
      <input type="number" id="amount" placeholder="0" min="0">
    </div>
    <div class="input-group">
      <div class="input-label">Category</div>
      <select id="category">
        <option value="🍔 Food">🍔 Food</option>
        <option value="🚗 Travel">🚗 Travel</option>
        <option value="🛍️ Shopping">🛍️ Shopping</option>
        <option value="💊 Health">💊 Health</option>
        <option value="📚 Education">📚 Education</option>
        <option value="🏠 Rent">🏠 Rent</option>
        <option value="⚡ Bills">⚡ Bills</option>
        <option value="💰 Salary">💰 Salary</option>
        <option value="🎁 Gift">🎁 Gift</option>
        <option value="📱 Recharge">📱 Recharge</option>
        <option value="🎮 Entertainment">🎮 Entertainment</option>
        <option value="💼 Business">💼 Business</option>
        <option value="🔧 Other">🔧 Other</option>
      </select>
    </div>
  </div>

  <div class="input-group">
    <div class="input-label">Description</div>
    <input type="text" id="description" placeholder="e.g. Lunch at office, Petrol..." maxlength="40">
  </div>

  <button class="add-btn income" id="addBtn" onclick="addTransaction()">+ Add Income</button>
</div>

<!-- Transactions List -->
<div class="tx-section">
  <div class="tx-header">
    <div class="tx-title">Transactions</div>
    <button class="clear-btn" onclick="clearAll()">Clear All</button>
  </div>
  <div id="txList"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let currentType = 'income';
  let transactions = JSON.parse(localStorage.getItem('paisatrack_tx') || '[]');

  // Set month
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const now = new Date();
  document.getElementById('monthBadge').textContent = months[now.getMonth()] + ' ' + now.getFullYear();

  function setType(type) {
    currentType = type;
    const incBtn = document.getElementById('incomeBtn');
    const expBtn = document.getElementById('expenseBtn');
    const addBtn = document.getElementById('addBtn');

    if (type === 'income') {
      incBtn.className = 'type-btn active-income';
      expBtn.className = 'type-btn';
      addBtn.className = 'add-btn income';
      addBtn.textContent = '+ Add Income';
    } else {
      incBtn.className = 'type-btn';
      expBtn.className = 'type-btn active-expense';
      addBtn.className = 'add-btn expense';
      addBtn.textContent = '+ Add Expense';
    }
  }

  function addTransaction() {
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    const description = document.getElementById('description').value.trim() || category;

    if (!amount || amount <= 0) { showToast('❌ Valid amount daalo!'); return; }

    const tx = {
      id: Date.now(),
      type: currentType,
      amount,
      category,
      description,
      date: new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })
    };

    transactions.unshift(tx);
    save();
    render();

    document.getElementById('amount').value = '';
    document.getElementById('description').value = '';
    showToast(currentType === 'income' ? '✅ Income added!' : '✅ Expense added!');
  }

  function deleteTransaction(id) {
    transactions = transactions.filter(t => t.id !== id);
    save();
    render();
    showToast('🗑️ Deleted!');
  }

  function clearAll() {
    if (transactions.length === 0) return;
    if (confirm('Sab transactions delete karo?')) {
      transactions = [];
      save();
      render();
      showToast('🗑️ All cleared!');
    }
  }

  function save() {
    localStorage.setItem('paisatrack_tx', JSON.stringify(transactions));
  }

  function formatAmount(n) {
    return '₹' + n.toLocaleString('en-IN');
  }

  function render() {
    const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const balance = income - expense;

    document.getElementById('totalBalance').textContent = formatAmount(balance);
    document.getElementById('totalIncome').textContent = formatAmount(income);
    document.getElementById('totalExpense').textContent = formatAmount(expense);

    const list = document.getElementById('txList');

    if (transactions.length === 0) {
      list.innerHTML = `<div class="tx-empty"><div class="tx-empty-icon">💸</div>Koi transaction nahi abhi.<br>Upar se add karo!</div>`;
      return;
    }

    list.innerHTML = transactions.map(t => `
      <div class="tx-item">
        <div class="tx-icon ${t.type}">${t.category.split(' ')[0]}</div>
        <div class="tx-info">
          <div class="tx-desc">${t.description}</div>
          <div class="tx-meta">
            <span class="tx-cat">${t.category}</span>
            <span>${t.date}</span>
          </div>
        </div>
        <div>
          <div class="tx-amount ${t.type}">${t.type === 'income' ? '+' : '-'}${formatAmount(t.amount)}</div>
        </div>
        <button class="tx-delete" onclick="deleteTransaction(${t.id})">✕</button>
      </div>
    `).join('');
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  render();
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
